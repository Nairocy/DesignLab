<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>09 · 包豪斯 — 拾光 SHIGUANG</title>
<!-- DesignLab · 09 包豪斯 Bauhaus — 三原色 + 几何构成 + 竖排题头 -->
<style>
  :root{--bg:#f4f1ea;--ink:#101010;--red:#d92b2b;--blue:#1f4ed8;--yellow:#f2c200}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:"Arial","Helvetica Neue",Helvetica,"Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.75}
  .wrap{max-width:1200px;margin:0 auto;padding:0 44px}

  /* ── 顶栏 ── */
  header{display:flex;justify-content:space-between;align-items:center;padding:26px 0;border-bottom:3px solid var(--ink)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;letter-spacing:.05em}
  .brand i{width:24px;height:24px;background:var(--red);display:block}
  nav a{color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:500;
    margin-left:30px;letter-spacing:.06em;padding:2px 4px}
  nav a:hover{background:var(--yellow)}

  /* ── 主视觉：竖排题头 / 标题 / 几何构成 三栏 ── */
  .hero{display:grid;grid-template-columns:64px minmax(0,1fr) 330px;gap:44px;padding:80px 0 76px;align-items:center}
  .rail{writing-mode:vertical-rl;text-orientation:upright;justify-self:start;align-self:stretch;
    border-right:3px solid var(--ink);padding-right:22px;font-size:12.5px;letter-spacing:.46em;color:#555}
  .kicker{display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:700;letter-spacing:.32em}
  .kicker i{width:13px;height:13px;background:var(--red);display:block}
  h1{font-size:clamp(46px,7vw,100px);font-weight:700;line-height:1.08;letter-spacing:-.015em;margin:26px 0 30px}
  .lede{max-width:470px;font-size:15px;line-height:2;color:#3a3a3a}
  .actions{margin-top:44px;display:flex;gap:16px;flex-wrap:wrap}
  .btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-size:13.5px;
    font-weight:700;letter-spacing:.12em;padding:15px 36px;transition:background .2s}
  .btn:hover{background:var(--red)}
  .btn.line{background:transparent;color:var(--ink);border:3px solid var(--ink);padding:12px 33px}
  .btn.line:hover{background:var(--yellow)}

  .shapes{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:104px;gap:16px}
  .shapes i{display:block}
  .sh-circle{border-radius:50%;background:var(--yellow)}
  .sh-tri{clip-path:polygon(50% 4%,96% 96%,4% 96%);background:var(--blue)}
  .sh-square{background:var(--red)}
  .sh-half{border-radius:999px 999px 0 0;background:var(--ink)}

  /* ── 特性：四格，形随机能 ── */
  .features{display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid var(--ink)}
  .feature{padding:32px 26px 56px;border-left:1px solid var(--ink)}
  .feature:first-child{border-left:0;padding-left:0}
  .feature .motif{width:26px;height:26px;margin-bottom:22px;display:block}
  .m-circle{background:var(--yellow);border-radius:50%}
  .m-tri{background:var(--blue);clip-path:polygon(50% 0,100% 100%,0 100%)}
  .m-square{background:var(--red)}
  .m-half{background:var(--ink);border-radius:999px 999px 0 0}
  .feature h3{font-size:17px;font-weight:700;letter-spacing:.08em;margin-bottom:10px}
  .feature p{font-size:13px;color:#4c4c4c;line-height:2}

  /* ── 页脚：黑条 ── */
  footer{background:var(--ink);color:#fff}
  .foot{display:flex;justify-content:space-between;padding:26px 0;font-size:12px;letter-spacing:.16em}

  .style-tag{position:fixed;right:20px;bottom:20px;z-index:99;font-size:11px;letter-spacing:.1em;color:#fff;
    background:rgba(20,20,20,.62);padding:8px 14px;border-radius:999px;text-decoration:none;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:.45;transition:opacity .25s}
  .style-tag:hover{opacity:1}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:960px){
    .hero{grid-template-columns:1fr;gap:40px;padding:56px 0}
    .rail{display:none}
    .shapes{max-width:330px}
  }
  @media (max-width:800px){
    .wrap{padding:0 24px}
    .features{grid-template-columns:1fr 1fr}
    .feature{border-left:0;border-top:1px solid var(--ink);padding:26px 18px 40px}
    .feature:nth-child(-n+2){border-top:0}
    .feature:first-child,.feature:nth-child(3){padding-left:0}
    .foot{flex-direction:column;gap:8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><i></i>拾光 SHIGUANG</div>
    <nav><a href="#">功能</a><a href="#">定价</a><a href="#">关于</a></nav>
  </header>

  <section class="hero">
    <div class="rail">SHIGUANG</div>
    <div>
      <div class="kicker"><i></i>灵感记录，轻如羽毛</div>
      <h1>把灵感，<br>留在拾光</h1>
      <p class="lede">一闪而过的想法最珍贵。拾光帮你随手捕捉、自动整理，让每一次创作都从从容容。</p>
      <div class="actions">
        <a class="btn" href="#">立即体验</a>
        <a class="btn line" href="#">了解更多</a>
      </div>
    </div>
    <div class="shapes" aria-hidden="true">
      <i class="sh-circle"></i><i class="sh-square"></i>
      <i class="sh-tri"></i><i class="sh-half"></i>
    </div>
  </section>

  <section class="features">
    <div class="feature"><i class="motif m-circle"></i><h3>一秒捕捉</h3><p>打开即写，灵感不过夜。</p></div>
    <div class="feature"><i class="motif m-tri"></i><h3>多端同步</h3><p>手机、平板与桌面，实时同步。</p></div>
    <div class="feature"><i class="motif m-square"></i><h3>极简专注</h3><p>只保留纸与笔的纯粹。</p></div>
    <div class="feature"><i class="motif m-half"></i><h3>全平台</h3><p>网页版随时可用，无需安装。</p></div>
  </section>

  <footer>
    <div class="foot">
      <span>© 2026 拾光 SHIGUANG · 保留所有权利</span>
      <span>BAUHAUS</span>
    </div>
  </footer>
</div>
<a class="style-tag" href="index.html">← 09 · 包豪斯</a>
</body>
</html>
